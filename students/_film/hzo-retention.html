<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Corm;src:url(fontsource-cormorant-garamond/files/cormorant-garamond-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:Corm;src:url(fontsource-cormorant-garamond/files/cormorant-garamond-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:Corm;src:url(fontsource-cormorant-garamond/files/cormorant-garamond-latin-400-italic.woff2);font-style:italic;font-weight:400}
@font-face{font-family:Corm;src:url(fontsource-cormorant-garamond/files/cormorant-garamond-latin-500-italic.woff2);font-style:italic;font-weight:500}

canvas{display:block}
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
const W=1920,H=1080,cv=document.getElementById('c'),x=cv.getContext('2d');
const C={bg:'#0a1120',ink:'#e6e9ef',muted:'#8c96a8',dim:'#4a5468',gold:'#d8b25c',blue:'#86aee6',green:'#46e38a',red:'#e46a5b',line:'#2a3446'};
const SANS='Inter, "DejaVu Sans", sans-serif',SERIF='Corm, serif',MONO='PMono, monospace';
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=t=>{t=cl(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const ramp=(t,a,b)=>ease((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`}

// scenes: [start, end]
const S=[[0,5.5],[5.5,12],[12,18.5],[18.5,25.5],[25.5,32.5],[32.5,41]];
const DUR=41;

const dust=(()=>{const r=rng(7);return Array.from({length:70},()=>({x:r()*W,y:r()*H,s:r()*1.6+.4,v:r()*6+2,a:r()*.25+.05}))})();
function bg(t){
  x.fillStyle=C.bg;x.fillRect(0,0,W,H);
  const g=x.createRadialGradient(W*.62,H*.45,50,W*.62,H*.45,W*.75);
  g.addColorStop(0,'rgba(30,48,82,0.55)');g.addColorStop(1,'rgba(10,17,32,0)');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  for(const d of dust){const y=(d.y-d.v*t+H*10)%H;x.fillStyle=`rgba(200,215,240,${d.a})`;x.beginPath();x.arc(d.x,y,d.s,0,7);x.fill()}
}
function txt(s,X,Y,font,col,al='left',a=1){x.globalAlpha*=a;x.font=font;x.fillStyle=col;x.textAlign=al;x.textBaseline='alphabetic';x.fillText(s,X,Y);x.globalAlpha/=a||1}
function spaced(s,X,Y,size,col,sp=3,al='left'){x.font=`${size}px ${MONO}`;x.fillStyle=col;x.textBaseline='alphabetic';
  let w=0;for(const ch of s)w+=x.measureText(ch).width+sp;let cx=al==='center'?X-w/2:X;x.textAlign='left';for(const ch of s){x.fillText(ch,cx,Y);cx+=x.measureText(ch).width+sp}}
function para(s,X,Y,maxW,size,col,lh=1.5,a=1){x.font=`300 ${size}px ${SANS}`;x.fillStyle=col;x.textAlign='left';const ws=s.split(' ');let line='',y=Y;x.globalAlpha*=a;
  for(const w of ws){const tt=line?line+' '+w:w;if(x.measureText(tt).width>maxW){x.fillText(line,X,y);line=w;y+=size*lh}else line=tt}x.fillText(line,X,y);x.globalAlpha/=a||1;return y}
function chrome(n,label,title,lt,a){
  x.save();x.globalAlpha=a;
  const k=ramp(lt,0,.8);
  x.strokeStyle=C.gold;x.lineWidth=1.5;x.beginPath();x.moveTo(135,112);x.lineTo(135+44*k,112);x.stroke();
  spaced(label,195,118,17,C.gold,4);
  x.globalAlpha=a*ramp(lt,.1,.9);
  txt(title,133,205+12*(1-ramp(lt,.1,.9)),`400 70px ${SERIF}`,C.ink);
  x.globalAlpha=a*.9;
  txt('MSc thesis project  ·  DTU Energy',135,1010,`300 17px ${SANS}`,C.dim);
  x.strokeStyle=rgba(C.gold,.35);x.lineWidth=1;x.beginPath();x.moveTo(135,1026);x.lineTo(560,1026);x.stroke();
  txt(`0${n}`,1742,1010,`italic 500 30px ${SERIF}`,C.gold,'right');
  txt(' / 05',1790,1010,`italic 400 26px ${SERIF}`,C.dim,'right');
  x.restore();
}
function sceneAlpha(t,i){const [a,b]=S[i];return Math.min(ramp(t,a,a+.7),1-ramp(t,b-.6,b))}

// ---------- Film 2: retention of ferroelectric memory states in HZO
const UP='#46e38a',DN='#e8964f';
function s0(t,a){
  x.save();x.globalAlpha=a;
  // faint arrows breathing on the right
  for(let i=0;i<5;i++){const X=1250+i*110,up=i%2===0,ph=Math.sin(t*1.3+i);
    x.globalAlpha=a*(.18+.06*ph);x.strokeStyle=up?UP:DN;x.lineWidth=4;
    x.beginPath();x.moveTo(X,up?720:520);x.lineTo(X,up?520:720);x.stroke();
    x.fillStyle=x.strokeStyle;x.beginPath();if(up){x.moveTo(X,500);x.lineTo(X-12,524);x.lineTo(X+12,524)}else{x.moveTo(X,740);x.lineTo(X-12,716);x.lineTo(X+12,716)}x.fill()}
  x.globalAlpha=a;
  const k=ramp(t,.2,1.2);
  x.strokeStyle=C.gold;x.lineWidth=1.5;x.beginPath();x.moveTo(135,330);x.lineTo(135+44*k,330);x.stroke();
  x.globalAlpha=a*k;spaced("MASTER'S THESIS PROJECT  ·  DTU ENERGY",195,336,17,C.gold,4);
  x.globalAlpha=a*ramp(t,.5,1.6);txt('How long does',130,450,`400 104px ${SERIF}`,C.ink);
  x.globalAlpha=a*ramp(t,1,2.1);txt('a written bit last?',130,560,`italic 400 104px ${SERIF}`,C.gold);
  x.globalAlpha=a*ramp(t,1.6,2.6);
  txt('Retention of ferroelectric memory states in hafnia–zirconia thin films',135,630,`300 27px ${SANS}`,C.muted);
  x.globalAlpha=a*ramp(t,2.2,3.2);
  txt('Prof. Vincenzo Esposito',135,740,`500 26px ${SANS}`,C.ink);
  spaced('SUPERVISOR',135,772,14,C.gold,4);
  txt('TiN / HZO / TiN capacitors  ·  can start independently',135,830,`300 20px ${SANS}`,C.muted);
  spaced('DTU ENERGY  ·  KONGENS LYNGBY  ·  OPEN PROJECT',135,870,13,C.dim,3);
  x.restore();
}
// capacitor with uniform arrows, coloured by state; fade: 0..1 loss of contrast
function cap(cx,cy,w,h,state,a,fade=0){
  x.save();x.globalAlpha=a;
  x.fillStyle='#9aa3b2';x.fillRect(cx-w/2,cy-h/2-16,w,16);x.fillRect(cx-w/2,cy+h/2,w,16);
  x.fillStyle='#2a2414';x.fillRect(cx-w/2,cy-h/2,w,h);
  const g=x.createLinearGradient(0,cy-h/2,0,cy+h/2);g.addColorStop(0,'rgba(216,178,92,.35)');g.addColorStop(1,'rgba(216,178,92,.15)');x.fillStyle=g;x.fillRect(cx-w/2,cy-h/2,w,h);
  txt('TiN',cx-w/2-14,cy-h/2-2,`italic 400 22px ${SERIF}`,C.muted,'right');txt('TiN',cx-w/2-14,cy+h/2+16,`italic 400 22px ${SERIF}`,C.muted,'right');
  txt('HZO',cx-w/2-14,cy+8,`italic 400 24px ${SERIF}`,C.gold,'right');
  if(state){const n=6;for(let i=0;i<n;i++){const px=cx-w/2+w*(i+.5)/n;const L=h*.3*(1-.55*fade*((i*7)%3)/2);
    const col=state>0?UP:DN;x.strokeStyle=col;x.fillStyle=col;x.lineWidth=3.5;x.globalAlpha=a*(1-.35*fade);
    x.beginPath();x.moveTo(px,cy+state*L);x.lineTo(px,cy-state*L);x.stroke();
    x.beginPath();x.moveTo(px,cy-state*(L+10));x.lineTo(px-8,cy-state*(L-3));x.lineTo(px+8,cy-state*(L-3));x.fill()}}
  x.restore();
}
function s1(t,a){
  const lt=t-S[1][0];chrome(1,'THE CONTEXT','Write it once, read it hours later',lt,a);
  x.save();x.globalAlpha=a;
  const cx=560,cy=560;
  const written=lt>1.0;
  const pulse=Math.exp(-Math.pow((lt-.8)/.2,2));
  cap(cx,cy,420,130,written?1:0,1,0);
  // wire & pulse
  x.strokeStyle=rgba(C.ink,.3);x.lineWidth=1.5;x.beginPath();x.moveTo(cx+210,cy-81);x.lineTo(cx+300,cy-81);x.lineTo(cx+300,cy+81);x.lineTo(cx+210,cy+81);x.stroke();
  x.fillStyle=lt<2.6?C.gold:C.dim;x.beginPath();x.arc(cx+300,cy,9,0,7);x.fill();
  if(pulse>.02){x.strokeStyle=C.gold;x.lineWidth=3;x.beginPath();x.moveTo(cx+300,cy);x.lineTo(cx+300,cy-90*pulse);x.stroke()}
  txt(lt<2.6?'write pulse':'power off',cx+300,cy+150,`italic 400 28px ${SERIF}`,lt<2.6?C.gold:C.muted,'center');
  // clock of hours passing
  if(lt>2.6){const k=ramp(lt,2.6,3.2);x.globalAlpha=a*k;const ox=cx,oy=cy+260,r=56;
    x.strokeStyle=rgba(C.ink,.5);x.lineWidth=2;x.beginPath();x.arc(ox,oy,r,0,7);x.stroke();
    const ang=(lt-2.6)*5;x.strokeStyle=C.ink;x.beginPath();x.moveTo(ox,oy);x.lineTo(ox+Math.sin(ang)*r*.8,oy-Math.cos(ang)*r*.8);x.stroke();
    x.beginPath();x.moveTo(ox,oy);x.lineTo(ox+Math.sin(ang/12)*r*.5,oy-Math.cos(ang/12)*r*.5);x.stroke();
    txt('hours at zero bias',ox+90,oy+10,`italic 400 26px ${SERIF}`,C.muted)}
  x.globalAlpha=a*ramp(lt,.5,1.5);
  para('A wireless sensor sleeps between measurements. Its last setting is stored as the direction of polarisation in a thin HZO film, written by a voltage pulse.',1200,440,560,27,C.ink);
  x.globalAlpha=a*ramp(lt,3.0,4.0);
  para('The question is what happens after the voltage is removed: how long can the two written states still be told apart?',1200,660,560,27,C.muted);
  x.restore();
}
function s2(t,a){
  const lt=t-S[2][0];chrome(2,'THE MEASUREMENT','Write, wait, read, repeat',lt,a);
  x.save();x.globalAlpha=a;
  // three stations
  const st=[{x:330,h:'write'},{x:810,h:'wait at 0 V'},{x:1290,h:'read'}];
  const cyc=2.0,c=Math.max(0,lt-.6),ci=Math.floor(c/cyc),ph=(c%cyc)/cyc;
  const delays=['t₁','t₂','t₃','t₄'];const di=Math.min(ci,3);
  st.forEach((s,i)=>{const act=(ph*3>=i&&ph*3<i+1);
    x.globalAlpha=a*(act?1:.45);
    txt(s.h,s.x,400,`italic 400 34px ${SERIF}`,act?C.gold:C.muted,'center')});
  x.globalAlpha=a;
  // write: capacitor with state alternating each cycle
  const state=ci%2===0?1:-1;
  cap(330,560,240,110,lt>.8?state:0,1,0);
  // wait: clock spinning longer for longer delays
  const ox=810,oy=560,r=80;x.strokeStyle=rgba(C.ink,.5);x.lineWidth=2;x.beginPath();x.arc(ox,oy,r,0,7);x.stroke();
  for(let k=0;k<12;k++){const an=k/12*Math.PI*2;x.beginPath();x.moveTo(ox+Math.sin(an)*r*.86,oy-Math.cos(an)*r*.86);x.lineTo(ox+Math.sin(an)*r,oy-Math.cos(an)*r);x.stroke()}
  const spin=(ph>1/3&&ph<2/3)?(ph-1/3)*3*Math.PI*2*(1+di):((ph>=2/3)?Math.PI*2*(1+di):0);
  x.strokeStyle=C.ink;x.lineWidth=3;x.beginPath();x.moveTo(ox,oy);x.lineTo(ox+Math.sin(spin)*r*.75,oy-Math.cos(spin)*r*.75);x.stroke();
  txt('delay '+delays[di],ox,oy+r+48,`400 24px ${SANS}`,C.ink,'center');
  // read: paired pulses + switched charge bar
  const rx=1170,ry=600,rw=240;x.strokeStyle=rgba(C.ink,.3);x.lineWidth=1;x.beginPath();x.moveTo(rx,ry);x.lineTo(rx+rw,ry);x.stroke();
  const rp=ph>=2/3?(ph-2/3)*3:0;
  x.strokeStyle=C.gold;x.lineWidth=3;x.beginPath();const seq=[[0,0],[.12,0],[.12,1],[.32,1],[.32,0],[.55,0],[.55,1],[.75,1],[.75,0],[1,0]];
  let started=false;for(let s=0;s<=200*rp;s++){const u=s/200;let v=0;for(let q=0;q<seq.length-1;q++)if(u>=seq[q][0]&&u<=seq[q+1][0])v=seq[q][1];const px=rx+u*rw,py=ry-v*70;started?x.lineTo(px,py):(x.moveTo(px,py),started=true)}x.stroke();
  // charge bar
  if(rp>.6){const hgt=120*(1-.12*di*(state<0?1.6:1));x.fillStyle=state>0?UP:DN;x.globalAlpha=a*ramp(rp,.6,.9);x.fillRect(rx+rw+50,ry+60-hgt,34,hgt);
    txt('switched charge',rx+rw+67,ry+100,`italic 400 22px ${SERIF}`,C.muted,'center');x.globalAlpha=a}
  // arrows between
  x.strokeStyle=rgba(C.ink,.35);x.lineWidth=1.5;[[480,640],[960,1120]].forEach(([p,q])=>{x.beginPath();x.moveTo(p,560);x.lineTo(q,560);x.stroke();x.beginPath();x.moveTo(q,560);x.lineTo(q-10,553);x.lineTo(q-10,567);x.fill()});
  x.globalAlpha=a*ramp(lt,1,2);
  para('Each read starts from a freshly written state. Only the delay changes, and it grows from one round to the next, for both polarisation directions.',135,820,1100,26,C.muted);
  x.restore();
}
// retention model (illustrative)
const devs=(()=>{const r=rng(5);return Array.from({length:5},()=>({u:(r()-.5),d:(r()-.5)}))})();
const RU=u=>.82-.10*u, RD=u=>-.80+.55*Math.pow(u,1.8); // u = log-time fraction 0..1
function axes(X0,Y0,PW,PH,ylab){
  x.strokeStyle=rgba(C.ink,.5);x.lineWidth=1.5;x.beginPath();x.moveTo(X0,Y0-PH);x.lineTo(X0,Y0);x.lineTo(X0+PW,Y0);x.stroke();
  for(let k=0;k<=4;k++){const px=X0+PW*k/4;x.beginPath();x.moveTo(px,Y0);x.lineTo(px,Y0+8);x.stroke()}
  txt('delay after writing (log scale)  →',X0+PW,Y0+46,`300 20px ${SANS}`,C.muted,'right');
  x.save();x.translate(X0-34,Y0-PH/2);x.rotate(-Math.PI/2);txt(ylab,0,0,`300 20px ${SANS}`,C.muted,'center');x.restore();
}
function s3(t,a){
  const lt=t-S[3][0];chrome(3,'THE RESULT','Two states, two curves',lt,a);
  x.save();x.globalAlpha=a;
  const X0=220,Y0=900,PW=900,PH=560,mid=Y0-PH/2;
  axes(X0,Y0,PW,PH,'retained switched charge');
  x.strokeStyle=rgba(C.ink,.2);x.setLineDash([4,8]);x.beginPath();x.moveTo(X0,mid);x.lineTo(X0+PW,mid);x.stroke();x.setLineDash([]);
  const pr=ramp(lt,1,4.5);
  [[RU,UP,'written up'],[RD,DN,'written down']].forEach(([f,col,name],j)=>{
    // points from several devices
    for(let k=0;k<9;k++){const u=k/8;if(u>pr+1e-6)continue;
      devs.forEach(d=>{const v=f(u)+.05*(j?d.d:d.u);x.fillStyle=rgba(col,.55);x.beginPath();x.arc(X0+u*PW+((j?d.d:d.u))*14,mid-v*PH*.5,4,0,7);x.fill()});
      const v=f(u);x.strokeStyle=col;x.lineWidth=2;x.beginPath();x.moveTo(X0+u*PW,mid-(v+.07)*PH*.5);x.lineTo(X0+u*PW,mid-(v-.07)*PH*.5);x.stroke()}
    x.strokeStyle=col;x.lineWidth=3;x.beginPath();for(let s=0;s<=200*pr;s++){const u=s/200;const px=X0+u*PW,py=mid-f(u)*PH*.5;s?x.lineTo(px,py):x.moveTo(px,py)}x.stroke();
    x.globalAlpha=a*ramp(lt,1.5,2.2);x.fillStyle=col;x.fillRect(X0+PW-200,Y0-PH+14+j*34,22,4);txt(name,X0+PW-168,Y0-PH+22+j*34,`300 20px ${SANS}`,C.ink);x.globalAlpha=a;
  });
  spaced('ILLUSTRATIVE CURVES, NOT DATA',X0+20,Y0-PH+20,14,C.muted,3);
  x.globalAlpha=a*ramp(lt,.6,1.6);
  para('Retention curves for both writing directions, each point repeated on several capacitors.',1300,450,460,26,C.ink);
  x.globalAlpha=a*ramp(lt,3.4,4.4);
  para('Does one direction lose its state faster than the other? And is the difference larger than the spread between devices?',1300,630,460,26,C.muted);
  x.restore();
}
function s4(t,a){
  const lt=t-S[4][0];chrome(4,'THE QUESTION','When do the states become indistinguishable?',lt,a);
  x.save();x.globalAlpha=a;
  const X0=220,Y0=900,PW=900,PH=520;
  axes(X0,Y0,PW,PH,'difference between the two states');
  const M=u=>RU(u)-RD(u); // margin, max ~1.62
  const spread=.42; // device variation band
  const sc=v=>Y0-v/1.7*PH;
  x.fillStyle=rgba(C.red,.12);x.fillRect(X0,sc(spread),PW,Y0-sc(spread));
  x.globalAlpha=a*ramp(lt,.8,1.5);spaced('ILLUSTRATIVE',X0+20,Y0-PH-10,14,C.muted,3);txt('device-to-device variation',X0+16,sc(spread)+30,`italic 400 24px ${SERIF}`,C.red);x.globalAlpha=a;
  const pr=ramp(lt,1,3.6);
  // extend model past data to intersect
  const Mx=u=>u<=1?M(u):M(1)-(M(.98)-M(1))/.02*(u-1);
  x.strokeStyle=C.gold;x.lineWidth=3;x.beginPath();for(let s=0;s<=200*pr;s++){const u=s/200*.75;const px=X0+u*PW,py=sc(Mx(u));s?x.lineTo(px,py):x.moveTo(px,py)}x.stroke();
  // last measured point
  const um=.75,k1=ramp(lt,3.6,4.3);
  x.globalAlpha=a*k1;x.fillStyle=C.gold;x.beginPath();x.arc(X0+um*PW,sc(Mx(um)),8,0,7);x.fill();
  x.strokeStyle=rgba(C.ink,.4);x.setLineDash([5,7]);x.beginPath();x.moveTo(X0+um*PW,Y0);x.lineTo(X0+um*PW,sc(Mx(um)));x.stroke();x.setLineDash([]);
  txt('longest measured delay',X0+um*PW,Y0-PH-6,`italic 500 28px ${SERIF}`,C.gold,'center');
  x.strokeStyle=rgba(C.gold,.6);x.beginPath();x.moveTo(X0+um*PW,Y0-PH+6);x.lineTo(X0+um*PW,sc(Mx(um))-14);x.stroke();
  // beyond: lower bound arrow
  const k2=ramp(lt,4.6,5.4);x.globalAlpha=a*k2;x.strokeStyle=C.green;x.lineWidth=2.5;
  const ay=sc(Mx(um))-50;x.beginPath();x.moveTo(X0+um*PW+20,ay);x.lineTo(X0+PW-10,ay);x.stroke();x.beginPath();x.moveTo(X0+PW-6,ay);x.lineTo(X0+PW-20,ay-8);x.lineTo(X0+PW-20,ay+8);x.fillStyle=C.green;x.fill();
  txt('still apart: a lower bound',X0+um*PW+30,ay-16,`italic 400 26px ${SERIF}`,C.green);
  x.globalAlpha=a*ramp(lt,.6,1.6);
  para('Your result: the longest measured delay at which the two states remain distinguishable.',1300,450,460,26,C.ink);
  x.globalAlpha=a*ramp(lt,4.4,5.4);
  para('If both states survive the whole experiment, you have a lower bound on retention under the tested conditions.',1300,630,460,26,C.muted);
  x.restore();
}
function s5(t,a){
  const lt=t-S[5][0];const endK=ramp(lt,4.6,5.4);chrome(5,'YOUR PROJECT','Write, wait, compare',lt,a*(1-endK));
  x.save();x.globalAlpha=a;
  const cols=[{n:'1',h:'Write and read',d:'Pulses that write each direction; paired read pulses that give a reproducible switched charge.'},
              {n:'2',h:'Wait',d:'Zero bias for growing delays, rewriting the state before every read.'},
              {n:'3',h:'Compare',d:'Both directions on several capacitors: which fades first, and is it beyond device spread?'}];
  cols.forEach((c,i)=>{
    const X=150+i*560,k=ramp(lt,.4+i*.5,1.2+i*.5)*(1-endK);
    x.globalAlpha=a*k;
    x.strokeStyle=rgba(C.gold,.5);x.lineWidth=1.5;x.beginPath();x.moveTo(X,330);x.lineTo(X+460,330);x.stroke();
    txt(c.n,X,420,`italic 500 64px ${SERIF}`,C.gold);
    txt(c.h,X+60,412,`400 48px ${SERIF}`,C.ink);
    const iy=470;
    if(i===0){cap(X+110,iy+70,150,70,1,a*k);cap(X+340,iy+70,150,70,-1,a*k)}
    if(i===1){x.globalAlpha=a*k;const ox=X+230,oy=iy+70,r=56;x.strokeStyle=rgba(C.ink,.5);x.lineWidth=2;x.beginPath();x.arc(ox,oy,r,0,7);x.stroke();
      const an=lt*2.5;x.strokeStyle=C.ink;x.lineWidth=3;x.beginPath();x.moveTo(ox,oy);x.lineTo(ox+Math.sin(an)*r*.75,oy-Math.cos(an)*r*.75);x.stroke();txt('0 V',ox,oy+r+34,`italic 400 24px ${SERIF}`,C.muted,'center')}
