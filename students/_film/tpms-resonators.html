<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Corm;src:url(fontsource-cormorant-garamond/files/cormorant-garamond-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:Corm;src:url(fontsource-cormorant-garamond/files/cormorant-garamond-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:Corm;src:url(fontsource-cormorant-garamond/files/cormorant-garamond-latin-400-italic.woff2);font-style:italic;font-weight:400}
@font-face{font-family:Corm;src:url(fontsource-cormorant-garamond/files/cormorant-garamond-latin-500-italic.woff2);font-style:italic;font-weight:500}
@font-face{font-family:PMono;src:url(fontsource-ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2)}
html,body{margin:0;background:#0a1120}
canvas{display:block}
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
const W=1920,H=1080,cv=document.getElementById('c'),x=cv.getContext('2d');
const C={bg:'#0a1120',ink:'#e6e9ef',muted:'#8c96a8',dim:'#4a5468',gold:'#d8b25c',blue:'#86aee6',green:'#46e38a',red:'#e46a5b',line:'#2a3446'};
const SANS='Inter, "DejaVu Sans", sans-serif',SERIF='Corm, serif',MONO='PMono, monospace';
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=t=>{t=cl(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const ramp=(t,a,b)=>ease((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`}

// scenes: [start, end]
const S=[[0,5.5],[5.5,12],[12,18.5],[18.5,25.5],[25.5,32.5],[32.5,41]];
const DUR=41;

const dust=(()=>{const r=rng(7);return Array.from({length:70},()=>({x:r()*W,y:r()*H,s:r()*1.6+.4,v:r()*6+2,a:r()*.25+.05}))})();
function bg(t){
  x.fillStyle=C.bg;x.fillRect(0,0,W,H);
  const g=x.createRadialGradient(W*.62,H*.45,50,W*.62,H*.45,W*.75);
  g.addColorStop(0,'rgba(30,48,82,0.55)');g.addColorStop(1,'rgba(10,17,32,0)');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  for(const d of dust){const y=(d.y-d.v*t+H*10)%H;x.fillStyle=`rgba(200,215,240,${d.a})`;x.beginPath();x.arc(d.x,y,d.s,0,7);x.fill()}
}
function txt(s,X,Y,font,col,al='left',a=1){x.globalAlpha*=a;x.font=font;x.fillStyle=col;x.textAlign=al;x.textBaseline='alphabetic';x.fillText(s,X,Y);x.globalAlpha/=a||1}
function spaced(s,X,Y,size,col,sp=3,al='left'){x.font=`${size}px ${MONO}`;x.fillStyle=col;x.textBaseline='alphabetic';
  let w=0;for(const ch of s)w+=x.measureText(ch).width+sp;let cx=al==='center'?X-w/2:X;x.textAlign='left';for(const ch of s){x.fillText(ch,cx,Y);cx+=x.measureText(ch).width+sp}}
function para(s,X,Y,maxW,size,col,lh=1.5,a=1){x.font=`300 ${size}px ${SANS}`;x.fillStyle=col;x.textAlign='left';const ws=s.split(' ');let line='',y=Y;x.globalAlpha*=a;
  for(const w of ws){const tt=line?line+' '+w:w;if(x.measureText(tt).width>maxW){x.fillText(line,X,y);line=w;y+=size*lh}else line=tt}x.fillText(line,X,y);x.globalAlpha/=a||1;return y}
function chrome(n,label,title,lt,a){
  x.save();x.globalAlpha=a;
  const k=ramp(lt,0,.8);
  x.strokeStyle=C.gold;x.lineWidth=1.5;x.beginPath();x.moveTo(135,112);x.lineTo(135+44*k,112);x.stroke();
  spaced(label,195,118,17,C.gold,4);
  x.globalAlpha=a*ramp(lt,.1,.9);
  txt(title,133,205+12*(1-ramp(lt,.1,.9)),`400 70px ${SERIF}`,C.ink);
  x.globalAlpha=a*.9;
  txt('MSc thesis project  ·  DTU Energy',135,1010,`300 17px ${SANS}`,C.dim);
  x.strokeStyle=rgba(C.gold,.35);x.lineWidth=1;x.beginPath();x.moveTo(135,1026);x.lineTo(560,1026);x.stroke();
  txt(`0${n}`,1742,1010,`italic 500 30px ${SERIF}`,C.gold,'right');
  txt(' / 05',1790,1010,`italic 400 26px ${SERIF}`,C.dim,'right');
  x.restore();
}
function sceneAlpha(t,i){const [a,b]=S[i];return Math.min(ramp(t,a,a+.7),1-ramp(t,b-.6,b))}

// ---------- Film 5: TPMS ultrasonic resonators (COMSOL)
const TEAL='#7fd1b9';
function arrow(x0,y0,x1,y1,col,w=4,hs=16){x.strokeStyle=col;x.fillStyle=col;x.lineWidth=w;x.beginPath();x.moveTo(x0,y0);x.lineTo(x1,y1);x.stroke();
  const an=Math.atan2(y1-y0,x1-x0);x.beginPath();x.moveTo(x1+Math.cos(an)*4,y1+Math.sin(an)*4);x.lineTo(x1-Math.cos(an-.45)*hs,y1-Math.sin(an-.45)*hs);x.lineTo(x1-Math.cos(an+.45)*hs,y1-Math.sin(an+.45)*hs);x.fill()}
const GN=300,gOff=document.createElement('canvas');gOff.width=GN;gOff.height=GN;const gctx=gOff.getContext('2d'),gImg=gctx.createImageData(GN,GN);
function gyroid(X,Y,S,z,a,per=1.5,wall=.32,sq=0){
  // sq: oscillation squeeze (-1..1) applied as anisotropic scale of the drawn image
  const d=gImg.data,k=Math.PI*2*per/GN,sz=Math.sin(z),cz=Math.cos(z);
  for(let j=0;j<GN;j++)for(let i=0;i<GN;i++){const xx=i*k,yy=j*k;const g=Math.sin(xx)*Math.cos(yy)+Math.sin(yy)*cz+sz*Math.cos(xx);
    const p=(j*GN+i)*4;const w=Math.abs(g)<wall;const e=Math.abs(Math.abs(g)-wall)<0.05;
    if(e){d[p]=200;d[p+1]=240;d[p+2]=225;d[p+3]=255}else if(w){d[p]=60;d[p+1]=130;d[p+2]=115;d[p+3]=235}else{d[p]=14;d[p+1]=22;d[p+2]=38;d[p+3]=255}}
  gctx.putImageData(gImg,0,0);x.save();x.globalAlpha=a;x.imageSmoothingEnabled=true;
  const dw=S*(1+.035*sq),dh=S*(1-.035*sq);x.drawImage(gOff,X+(S-dw)/2,Y+(S-dh)/2,dw,dh);x.strokeStyle=rgba(TEAL,.5);x.lineWidth=1.5;x.strokeRect(X+(S-dw)/2,Y+(S-dh)/2,dw,dh);x.restore();
}
function s0(t,a){
  x.save();x.globalAlpha=a;
  gyroid(1340,300,440,.7,a*.6,1.5,.32,Math.sin(t*9));
  const k=ramp(t,.2,1.2);
  x.strokeStyle=C.gold;x.lineWidth=1.5;x.beginPath();x.moveTo(135,330);x.lineTo(135+44*k,330);x.stroke();
  x.globalAlpha=a*k;spaced("MASTER'S THESIS PROJECT  ·  DTU ENERGY",195,336,17,C.gold,4);
  x.globalAlpha=a*ramp(t,.5,1.6);txt('Can geometry alone',130,450,`400 104px ${SERIF}`,C.ink);
  x.globalAlpha=a*ramp(t,1,2.1);txt('tune a resonator?',130,560,`italic 400 104px ${SERIF}`,C.gold);
  x.globalAlpha=a*ramp(t,1.6,2.6);
  txt('Tuning 3D-printed piezoelectric gyroids as ultrasonic resonators',135,630,`300 27px ${SANS}`,C.muted);
  x.globalAlpha=a*ramp(t,2.2,3.2);
  txt('Prof. Vincenzo Esposito',135,740,`500 26px ${SANS}`,C.ink);
  spaced('SUPERVISOR',135,772,14,C.gold,4);
  txt('Lead-free KNN  ·  TPMS gyroid  ·  COMSOL Multiphysics',135,830,`300 20px ${SANS}`,C.muted);
  spaced('DTU ENERGY  ·  KONGENS LYNGBY  ·  OPEN PROJECT',135,870,13,C.dim,3);
  x.restore();
}
function s1(t,a){
  const lt=t-S[1][0];chrome(1,'THE QUESTION','Same space, same ceramic, different note',lt,a);
  x.save();x.globalAlpha=a;
  const on=ramp(lt,1.2,1.8);
  gyroid(150,340,400,.7,a*ramp(lt,.2,.9),1.1,.32,on*Math.sin(lt*7));
  gyroid(650,340,400,.7,a*ramp(lt,.5,1.2),2.4,.36,on*Math.sin(lt*16));
  txt('coarse pitch',350,800,`italic 400 30px ${SERIF}`,C.ink,'center');
  txt('fine pitch',850,800,`italic 400 30px ${SERIF}`,C.ink,'center');
  // little traces
  x.globalAlpha=a*on;[[150,7,'f₁'],[650,16,'f₂']].forEach(([X,w,l])=>{x.strokeStyle=TEAL;x.lineWidth=2.5;x.beginPath();for(let s=0;s<=200;s++){const u=s/200;const px=X+u*400,py=860+18*Math.sin(u*w*2.4-lt*w);s?x.lineTo(px,py):x.moveTo(px,py)}x.stroke();txt(l,X+420,868,`italic 500 30px ${SERIF}`,TEAL)});
  x.globalAlpha=a*ramp(lt,.6,1.6);
  para('Two resonators with the same outer size and the same ceramic can vibrate at different frequencies.',1200,440,560,27,C.ink);
  x.globalAlpha=a*ramp(lt,2.8,3.8);
  para('Could the spacing and thickness of the curved inner walls tune an ultrasonic transducer?',1200,640,560,27,C.muted);
  x.restore();
}
function s2(t,a){
  const lt=t-S[2][0];chrome(2,'THE DEVICE','Electrodes on a curved piezoelectric wall',lt,a);
  x.save();x.globalAlpha=a;
  // wall section with AC drive
  const WX=200,WW=640,WY=560;const drive=ramp(lt,1.4,2)*Math.sin(lt*10);
  const bend=36+22*drive;
  function arc(y0,col,th){x.fillStyle=col;x.beginPath();x.moveTo(WX,y0);x.quadraticCurveTo(WX+WW/2,y0+bend,WX+WW,y0);x.lineTo(WX+WW,y0+th);x.quadraticCurveTo(WX+WW/2,y0+bend+th,WX,y0+th);x.closePath();x.fill()}
  arc(WY-110,'#9aa3b2',18);arc(WY-92,rgba(TEAL,.55),150);arc(WY+58,'#9aa3b2',18);
  txt('electrode',WX-20,WY-95,`italic 400 26px ${SERIF}`,C.muted,'right');
  txt('KNN wall',WX-20,WY+5,`italic 400 26px ${SERIF}`,TEAL,'right');
  txt('electrode',WX-20,WY+75,`italic 400 26px ${SERIF}`,C.muted,'right');
  // poling through the wall
  for(let i=0;i<4;i++){const u=(i+.5)/4,px=WX+u*WW,yo=bend*4*u*(1-u);arrow(px,WY+40+yo,px,WY-40+yo,rgba(C.green,.85),3,12)}
  txt('poling through the wall',WX+WW/2,WY+140+bend,`italic 400 24px ${SERIF}`,C.green,'center');
  // AC source
  const sx=WX+WW+90;x.strokeStyle=rgba(C.ink,.4);x.lineWidth=1.5;x.beginPath();x.moveTo(WX+WW,WY-101);x.lineTo(sx,WY-101);x.lineTo(sx,WY+67);x.lineTo(WX+WW,WY+67);x.stroke();
  x.fillStyle=C.bg;x.beginPath();x.arc(sx,WY-17,30,0,7);x.fill();x.strokeStyle=C.gold;x.lineWidth=2;x.stroke();
  x.beginPath();for(let s=0;s<=30;s++){const u=s/30;const px=sx-18+u*36,py=WY-17-10*Math.sin(u*Math.PI*2);s?x.lineTo(px,py):x.moveTo(px,py)}x.stroke();
  // two kinds of mode
  const mk=ramp(lt,2.6,3.4);x.globalAlpha=a*mk;
  const mx=1220,my=430;
  spaced('TWO KINDS OF MODE',mx,my-40,14,C.gold,3);
  // whole device breathing
  const br=Math.sin(lt*6);x.strokeStyle=TEAL;x.lineWidth=2.5;const bw=150*(1+.08*br),bh=150*(1-.08*br);x.strokeRect(mx+75-bw/2,my+75-bh/2,bw,bh);
  txt('whole device',mx+75,my+200,`italic 400 26px ${SERIF}`,C.ink,'center');
  // single wall bending
  const ox=mx+300;x.strokeStyle=rgba(C.ink,.35);x.strokeRect(ox,my,150,150);
  x.strokeStyle=TEAL;x.lineWidth=3;x.beginPath();x.moveTo(ox,my+75);x.quadraticCurveTo(ox+75,my+75+40*Math.sin(lt*14),ox+150,my+75);x.stroke();
  txt('one wall bending',ox+75,my+200,`italic 400 26px ${SERIF}`,C.ink,'center');
  x.globalAlpha=a*ramp(lt,3.6,4.6);
  para('An alternating voltage drives the wall. Some modes move the whole device, others bend individual walls.',1220,720,520,24,C.muted);
  x.restore();
}
// illustrative frequency field: rises with wall thickness, falls with pitch
const fmap=(p,w)=>cl(.15+.75*(w*.9+(1-p)*.6)/1.5);
function s3(t,a){
  const lt=t-S[3][0];chrome(3,'THE MAP','Resonance frequency against geometry',lt,a);
  x.save();x.globalAlpha=a;
  const X0=230,Y0=870,PW=560,PH=520;
  const k=ramp(lt,.6,2.2);
  const N=28;for(let i=0;i<N;i++)for(let j=0;j<N;j++){const p=(i+.5)/N,w=(j+.5)/N;if(p>k)continue;const f=fmap(p,w);
    x.fillStyle=`rgb(${Math.round(20+40*f)},${Math.round(40+150*f)},${Math.round(60+110*f)})`;x.fillRect(X0+i*PW/N,Y0-(j+1)*PH/N,PW/N+1,PH/N+1)}
  x.strokeStyle=rgba(C.ink,.5);x.lineWidth=1.5;x.beginPath();x.moveTo(X0,Y0-PH);x.lineTo(X0,Y0);x.lineTo(X0+PW,Y0);x.stroke();
  txt('cell pitch  →',X0+PW,Y0+44,`300 20px ${SANS}`,C.muted,'right');
  x.save();x.translate(X0-32,Y0-PH/2);x.rotate(-Math.PI/2);txt('wall thickness  →',0,0,`300 20px ${SANS}`,C.muted,'center');x.restore();
  spaced('RESONANCE FREQUENCY  ·  ILLUSTRATIVE',X0,Y0-PH-24,14,C.muted,3);
  // colour bar
  const cbx=X0+PW+24;for(let s=0;s<100;s++){const f=s/99;x.fillStyle=`rgb(${Math.round(20+40*f)},${Math.round(40+150*f)},${Math.round(60+110*f)})`;x.fillRect(cbx,Y0-(s+1)*PH/100,16,PH/100+1)}
  txt('high',cbx+24,Y0-PH+14,`italic 400 22px ${SERIF}`,C.muted);txt('low',cbx+24,Y0,`italic 400 22px ${SERIF}`,C.muted);
  // cursor path and preview
  const c=ramp(lt,2.2,6.0);const p=.15+.7*c,w=.25+.5*(.5+.5*Math.sin(c*Math.PI*1.6));
  if(lt>2.2){x.strokeStyle=C.gold;x.lineWidth=2.5;x.beginPath();x.arc(X0+p*PW,Y0-w*PH,13,0,7);x.stroke();
    gyroid(1240,330,300,.7,a,2.6-1.6*p,.2+.25*w,Math.sin(lt*(6+14*fmap(p,w))));
    txt('pitch '+(p<.4?'fine':p<.7?'medium':'coarse')+'  ·  wall '+(w<.42?'thin':w<.62?'medium':'thick'),1390,680,`italic 400 26px ${SERIF}`,C.ink,'center')}
  x.globalAlpha=a*ramp(lt,.6,1.6);
  para('Vary cell pitch and wall thickness, and follow each mode by its deformation pattern.',1180,770,600,24,C.muted);
  x.restore();
}
function s4(t,a){
  const lt=t-S[4][0];chrome(4,'THE TEST','Which modes can the electrodes drive?',lt,a);
  x.save();x.globalAlpha=a;
  const X0=200,Y0=860,PW=1000,PH=480;
  x.strokeStyle=rgba(C.ink,.5);x.lineWidth=1.5;x.beginPath();x.moveTo(X0,Y0-PH);x.lineTo(X0,Y0);x.lineTo(X0+PW,Y0);x.stroke();
  txt('drive frequency  →',X0+PW,Y0+44,`300 20px ${SANS}`,C.muted,'right');
  x.save();x.translate(X0-32,Y0-PH/2);x.rotate(-Math.PI/2);txt('electrical admittance |Y|',0,0,`300 20px ${SANS}`,C.muted,'center');x.restore();
  spaced('ILLUSTRATIVE',X0+20,Y0-PH-20,14,C.muted,3);
  const modes=[[.18,.0],[.3,.75],[.44,.0],[.58,.45],[.72,.0],[.85,.9]];
  // eigenfrequency ticks
  const k1=ramp(lt,.6,1.6);x.globalAlpha=a*k1;
  modes.forEach(([f])=>{x.strokeStyle=rgba(C.ink,.35);x.setLineDash([4,6]);x.beginPath();x.moveTo(X0+f*PW,Y0);x.lineTo(X0+f*PW,Y0-PH*.95);x.stroke();x.setLineDash([])});
  txt('eigenfrequencies',X0+modes[0][0]*PW+10,Y0-PH*.95+44,`italic 400 22px ${SERIF}`,C.muted);
  // admittance sweep
  const pr=ramp(lt,1.6,4.0);x.globalAlpha=a;
  const Y=u=>.08+modes.reduce((s,[f,h])=>s+h*Math.exp(-Math.pow((u-f)/.012,2)),0);
  x.strokeStyle=TEAL;x.lineWidth=3;x.beginPath();for(let s=0;s<=400*pr;s++){const u=s/400;const px=X0+u*PW,py=Y0-Y(u)*PH*.85;s?x.lineTo(px,py):x.moveTo(px,py)}x.stroke();
  // labels silent vs driven
  const k2=ramp(lt,4,4.8);x.globalAlpha=a*k2;
  txt('driven',X0+.85*PW,Y0-PH*.85*.98-18,`italic 500 26px ${SERIF}`,TEAL,'center');
  txt('silent',X0+.44*PW,Y0-60,`italic 400 24px ${SERIF}`,C.muted,'center');
  // measured peak overlay
  const k3=ramp(lt,4.8,5.6);x.globalAlpha=a*k3;x.strokeStyle=C.gold;x.lineWidth=2.5;x.setLineDash([8,6]);x.beginPath();
  for(let s=0;s<=200;s++){const u=.78+s/200*.14;const py=Y0-(.08+.82*Math.exp(-Math.pow((u-.862)/.014,2)))*PH*.85;s?x.lineTo(X0+u*PW,py):x.moveTo(X0+u*PW,py)}x.stroke();x.setLineDash([]);
  txt('printed specimen',X0+.9*PW+14,Y0-PH*.6,`italic 400 24px ${SERIF}`,C.gold);
  x.globalAlpha=a*ramp(lt,.6,1.6);
  para('Not every mode answers the electrodes. A frequency sweep of the electrical admittance shows which ones do.',1300,440,460,25,C.ink);
  x.globalAlpha=a*ramp(lt,4.8,5.8);
  para('Where printed specimens exist, measured peaks test the model.',1300,640,460,25,C.muted);
  x.restore();
}
function s5(t,a){
  const lt=t-S[5][0];const endK=ramp(lt,4.6,5.4);chrome(5,'YOUR PROJECT','Model, map, compare',lt,a*(1-endK));
  x.save();x.globalAlpha=a;
  const cols=[{n:'1',h:'Model',d:'A finite piezoelectric model in COMSOL: electrodes, poling, supports, converged mesh.'},
              {n:'2',h:'Map',d:'Resonance frequency, mode shape and admittance against pitch and wall thickness.'},
              {n:'3',h:'Compare',d:'Where specimens exist: measured dimensions and peaks against the model.'}];
  cols.forEach((c,i)=>{
    const X=150+i*560,k=ramp(lt,.4+i*.5,1.2+i*.5)*(1-endK);
    x.globalAlpha=a*k;
    x.strokeStyle=rgba(C.gold,.5);x.lineWidth=1.5;x.beginPath();x.moveTo(X,330);x.lineTo(X+460,330);x.stroke();
    txt(c.n,X,420,`italic 500 64px ${SERIF}`,C.gold);txt(c.h,X+60,412,`400 48px ${SERIF}`,C.ink);
    const iy=470;
    if(i===0){gyroid(X+150,iy,150,.7,a*k,1.5,.32,Math.sin(lt*8))}
    if(i===1){const N=10;for(let p=0;p<N;p++)for(let w=0;w<N;w++){const f=fmap((p+.5)/N,(w+.5)/N);x.fillStyle=`rgb(${Math.round(20+40*f)},${Math.round(40+150*f)},${Math.round(60+110*f)})`;x.fillRect(X+150+p*15,iy+150-(w+1)*15,15,15)}}
    if(i===2){x.globalAlpha=a*k;x.strokeStyle=TEAL;x.lineWidth=3;x.beginPath();for(let s=0;s<=100;s++){const u=s/100;const py=iy+150-130*Math.exp(-Math.pow((u-.5)/.07,2));s?x.lineTo(X+80+u*300,py):x.moveTo(X+80+u*300,py)}x.stroke();
      x.strokeStyle=C.gold;x.setLineDash([7,6]);x.beginPath();for(let s=0;s<=100;s++){const u=s/100;const py=iy+150-118*Math.exp(-Math.pow((u-.54)/.07,2));s?x.lineTo(X+80+u*300,py):x.moveTo(X+80+u*300,py)}x.stroke();x.setLineDash([])}
    x.globalAlpha=a*k;para(c.d,X,iy+220,440,22,C.muted);
  });
  x.globalAlpha=a*endK;
  spaced('OPEN MASTER\'S THESIS  ·  DTU ENERGY',W/2,440,18,C.gold,5,'center');
  txt('Can geometry alone tune a resonator?',W/2,540,`italic 400 76px ${SERIF}`,C.ink,'center');
  txt('Prof. Vincenzo Esposito  ·  3D-printed KNN gyroids in COMSOL',W/2,620,`300 26px ${SANS}`,C.muted,'center');
  txt('esplab-droid.github.io/students',W/2,700,`400 22px ${MONO}`,C.blue,'center');
  x.restore();
}

const SC=[s0,s1,s2,s3,s4,s5];
window.render=function(t){
  bg(t);
  for(let i=0;i<SC.length;i++){const al=sceneAlpha(t,i);if(al>0.001)SC[i](t,al)}
};
window.DUR=DUR;
window.ready=document.fonts.load('400 70px Corm').then(()=>Promise.all([document.fonts.load('italic 400 70px Corm'),document.fonts.load('italic 500 70px Corm'),document.fonts.load('500 70px Corm'),document.fonts.load('400 20px PMono')])).then(()=>{render(0);return true});
</script></body></html>
